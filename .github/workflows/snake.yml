name: 잔디 뱀 만들기

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - id: first
        continue-on-error: true
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#156B67&color_dots=#EBE3D6,#BFE3DF,#7FC4BD,#3E9A93,#156B67
            dist/snake-dark.svg?palette=github-dark&color_snake=#F07A72
      # GitHub이 가끔 기여 데이터를 늦게 줘서 실패하면 잠깐 쉬고 한 번 더 그린다.
      - if: steps.first.outcome == 'failure'
        run: sleep 30
      - if: steps.first.outcome == 'failure'
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#156B67&color_dots=#EBE3D6,#BFE3DF,#7FC4BD,#3E9A93,#156B67
            dist/snake-dark.svg?palette=github-dark&color_snake=#F07A72
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
